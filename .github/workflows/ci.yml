name: CI

on:
  push:
    branches: [main, fase-1-fundacao]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Sobe Postgres, RustFS e Mailpit
        run: docker compose -f docker-compose.dev.yml up -d --wait
      - run: cp .env.example .env
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:integration

      - name: Build de produção
        run: npm run build
      - name: Servidor para os e2e
        run: |
          npm run start &
          npx wait-on --timeout 120000 http://localhost:3000/api/health
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem Docker
        run: docker build -t egd-app:ci .
